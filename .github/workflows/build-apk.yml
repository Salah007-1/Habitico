name: Build Habitico Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'icon.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f icon.png ] && cp icon.png www/icon.png || true
          [ -f sw.js ] && cp sw.js www/sw.js || true

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform & sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions (Notifications & Exact Alarms)
        run: |
          python3 - << 'PY'
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              xml = f.read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.VIBRATE'
          ]
          inject = [f'    <uses-permission android:name="{p}" />' for p in perms if p not in xml]
          if inject:
              xml = xml.replace('<application', '\n'.join(inject) + '\n\n    <application', 1)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(xml)
          PY

      - name: Apply Properly Scaled Adaptive Fox Icon & White Vector Notification Icon
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow
          python3 - << 'PY'
          import os
          from PIL import Image

          res_root = 'android/app/src/main/res'
          if os.path.isfile('icon.png'):
              src = Image.open('icon.png').convert('RGBA')
              px = src.getpixel((4, 4))
              bg_hex = '#{:02X}{:02X}{:02X}'.format(px[0], px[1], px[2])

              values_dir = os.path.join(res_root, 'values')
              os.makedirs(values_dir, exist_ok=True)
              with open(os.path.join(values_dir, 'ic_launcher_background.xml'), 'w', encoding='utf-8') as f:
                  f.write(f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">{bg_hex}</color>
          </resources>
          ''')

              anydpi_dir = os.path.join(res_root, 'mipmap-anydpi-v26')
              os.makedirs(anydpi_dir, exist_ok=True)
              adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
              for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  with open(os.path.join(anydpi_dir, name), 'w', encoding='utf-8') as f:
                      f.write(adaptive_xml)

              for dname, leg_sz, fg_sz in [
                  ('mipmap-mdpi', 48, 108),
                  ('mipmap-hdpi', 72, 162),
                  ('mipmap-xhdpi', 96, 216),
                  ('mipmap-xxhdpi', 144, 324),
                  ('mipmap-xxxhdpi', 192, 432),
              ]:
                  ddir = os.path.join(res_root, dname)
                  os.makedirs(ddir, exist_ok=True)
                  src.resize((leg_sz, leg_sz), Image.LANCZOS).save(os.path.join(ddir, 'ic_launcher.png'))
                  src.resize((leg_sz, leg_sz), Image.LANCZOS).save(os.path.join(ddir, 'ic_launcher_round.png'))
                  fg_canvas = Image.new('RGBA', (fg_sz, fg_sz), (px[0], px[1], px[2], 255))
                  inner_sz = int(round(fg_sz * 0.68))
                  inner_img = src.resize((inner_sz, inner_sz), Image.LANCZOS)
                  offset = (fg_sz - inner_sz) // 2
                  fg_canvas.paste(inner_img, (offset, offset), inner_img)
                  fg_canvas.save(os.path.join(ddir, 'ic_launcher_foreground.png'))

          drawable_dir = os.path.join(res_root, 'drawable')
          os.makedirs(drawable_dir, exist_ok=True)
          fox_vector_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M4.2,2.5 L9.3,7.1 C10.1,6.8 11.0,6.6 12,6.6 C13.0,6.6 13.9,6.8 14.7,7.1 L19.8,2.5 C20.3,2.1 21.1,2.4 21.1,3.1 L20.6,11.6 C20.5,13.6 19.4,15.5 17.7,16.7 L12.6,20.8 C12.2,21.1 11.8,21.1 11.4,20.8 L6.3,16.7 C4.6,15.5 3.5,13.6 3.4,11.6 L2.9,3.1 C2.9,2.4 3.7,2.1 4.2,2.5 Z M8.5,12.2 A1.2,1.2 0 1,0 8.5,14.6 A1.2,1.2 0 1,0 8.5,12.2 Z M15.5,12.2 A1.2,1.2 0 1,0 15.5,14.6 A1.2,1.2 0 1,0 15.5,12.2 Z M12,17.8 L10.7,16.2 L13.3,16.2 Z"
                  android:fillType="evenOdd" />
          </vector>
          '''
          with open(os.path.join(drawable_dir, 'ic_stat_habitico.xml'), 'w', encoding='utf-8') as f:
              f.write(fox_vector_xml)
          PY

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Upload Habitico APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
