name: Build Habitico Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'icon.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f icon.png ] && cp icon.png www/icon.png || true
          [ -f sw.js ] && cp sw.js www/sw.js || true

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform & sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions (Notifications & Exact Alarms)
        run: |
          python3 - << 'PY'
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              xml = f.read()

          perms = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.VIBRATE'
          ]
          inject = []
          for p in perms:
              tag = f'    <uses-permission android:name="{p}" />'
              if p not in xml:
                  inject.append(tag)
          if inject:
              xml = xml.replace('<application', '\n'.join(inject) + '\n\n    <application', 1)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(xml)
          print('Manifest updated successfully')
          PY

      - name: Apply Habitico App Icon & Fox Notification Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -f icon.png ]; then
            declare -A SIZES=( [mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192 )
            for dir in "${!SIZES[@]}"; do
              sz="${SIZES[$dir]}"
              mkdir -p "android/app/src/main/res/$dir"
              convert icon.png -resize "${sz}x${sz}!" "android/app/src/main/res/$dir/ic_launcher.png" 2>/dev/null || cp icon.png "android/app/src/main/res/$dir/ic_launcher.png"
              convert icon.png -resize "${sz}x${sz}!" "android/app/src/main/res/$dir/ic_launcher_round.png" 2>/dev/null || cp icon.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi
          mkdir -p android/app/src/main/res/drawable
          cat << 'XML' > android/app/src/main/res/drawable/ic_stat_habitico.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFF"
                android:fillType="evenOdd"
                android:pathData="M3.5,3 L9.2,7.6 Q12,6.8 14.8,7.6 L20.5,3 L21.5,11.8 L12,21.5 L2.5,11.8 Z M7.2,12.2 L10.3,13.4 L8.4,14.6 Z M16.8,12.2 L13.7,13.4 L15.6,14.6 Z" />
          </vector>
          XML

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Upload Habitico APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
