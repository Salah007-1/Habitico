name: Build Habitico Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'icon.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f icon.png ] && cp icon.png www/icon.png || true
          [ -f sw.js ] && cp sw.js www/sw.js || true

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform & sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions (Notifications & Exact Alarms)
        run: |
          python3 - << 'PY'
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              xml = f.read()

          perms = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.VIBRATE'
          ]
          inject = []
          for p in perms:
              tag = f'    <uses-permission android:name="{p}" />'
              if p not in xml:
                  inject.append(tag)
          if inject:
              xml = xml.replace('<application', '\n'.join(inject) + '\n\n    <application', 1)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(xml)
          print('Manifest updated successfully')
          PY

      - name: Apply Habitico App Icon from icon.png
        run: |
          if [ -f icon.png ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp icon.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp icon.png "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp icon.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Upload Habitico APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

